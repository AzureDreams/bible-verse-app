<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verse of the Day</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Bible Verse of the Day</h1>
      <p id="date"></p>
      <blockquote id="verse"></blockquote>
      <cite id="reference"></cite>
      <p id="error" hidden></p>
      <div class="buttons">
        <button id="new-verse">New Verse</button>
        <button id="copy">Copy</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
